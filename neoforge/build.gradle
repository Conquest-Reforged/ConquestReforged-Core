plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    /*maven { url = "https://jitpack.io/" }
    maven { url = "https://mvn.devos.one/snapshots/" }
    maven { url = "https://mvn.devos.one/releases/" }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release"}
    maven {
        url = "https://api.modrinth.com/maven"
    }*/

    maven {
        url "https://maven.su5ed.dev/releases"
    }
}



dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    // Remove the next line if you don't want to depend on the API
    api "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    //implementation( "org.sinytra.forgified-fabric-api:forgified-fabric-api:0.155.0+26.1.2+3.2.6")

    common(project(path: ":common")) { transitive false }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

// Custom task to replace strings in obj_json files
task replaceStringsInObjJson(type: Copy) {
    from project(":common").file("src/main/resources/assets/conquest/models/block/obj_json")
    into "${buildDir}/resources/main/assets/conquest/models/block"

    include "**/*.json"

    filter { line ->
        line.replace("neoforge", "neoforge")
    }

    // Only run if the source directory exists
    onlyIf {
        project(":common").file("src/main/resources/assets/conquest/models/block/obj_json").exists()
    }
}

processResources {
    setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    inputs.property "version", project.version

    // Make sure our string replacement task runs before processing resources
    dependsOn replaceStringsInObjJson

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

jar {
    archiveClassifier = "raw"
}


shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    exclude "**/assets/conquest/models/block/obj_json/**"

    dependsOn(jar)
    mainSpec.sourcePaths.clear()       // Remove default source set inclusion
    from(zipTree(jar.archiveFile))     // Unpack jar output (preserves Loom modifications)

    setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    zip64(true)

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null           // shadowJar becomes the main artifact
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifact(shadowJar) {
                builtBy shadowJar
            }
            artifact(sourcesJar)
        }
    }
}