plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = file("src/main/resources/ConquestReforged.accesswidener")

    runs {
        refabricatedDataGenClient {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(':common').file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${modid}"

            runDir "build/datagen"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        url = uri("${projectDir}/libs/local-maven")
    }
    //maven { url = "https://jitpack.io/" }
    maven { url = "https://mvn.devos.one/snapshots/" }
    maven { url = "https://mvn.devos.one/releases/" }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release"}
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven { url = 'https://maven.terraformersmc.com' }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Remove the next line if you don't want to depend on the API
    api "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
    //modImplementation(include("io.github.fabricators_of_create.Porting-Lib:obj_loader:2.3.4+1.21.1"))
    //modImplementation(include("io.github.fabricators_of_create.Porting-Lib:entity:2.3.4+1.21.1"))
    implementation("io.github.llamalad7:mixinextras-fabric:0.4.1")
    annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.4.1")

    implementation("com.terraformersmc:modmenu:${modmenu_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }

    //modImplementation include("io.github.fabricators_of_create:neoforge_core:3.1.0+1.21.1")
    //modImplementation include("io.github.fabricators_of_create:neoforge_gametest:3.1.0+1.21.1")
    //modImplementation include("io.github.fabricators_of_create:neoforge_model_loader:3.1.0+1.21.1")
    //modImplementation include("io.github.fabricators_of_create:neoforge_obj_loader:3.1.0+1.21.1")
    //modImplementation include("io.github.fabricators_of_create:neoforge_render_types:3.1.0+1.21.1")

    common(project(path: ":common")) { transitive false }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

// Custom task to replace strings in obj_json files
task replaceStringsInObjJson(type: Copy) {
    from project(":common").file("src/main/resources/assets/conquest/models/block/obj_json")
    into "${buildDir}/resources/main/assets/conquest/models/block"

    include "**/*.json"

    // Only run if the source directory exists
    onlyIf {
        project(":common").file("src/main/resources/assets/conquest/models/block/obj_json").exists()
    }
}

processResources {
    setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    inputs.property "version", project.version

    // Make sure our string replacement task runs before processing resources
    dependsOn replaceStringsInObjJson

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}


jar {
    archiveClassifier = "raw"
}


shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from { zipTree(jar.archiveFile) } 

    setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    zip64(true)
    exclude "architectury.common.json"
    exclude "**/assets/conquest/models/block/obj_json/**"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null           // shadowJar becomes the main artifact
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    'src/main/generated'
            ]
        }
    }
}
