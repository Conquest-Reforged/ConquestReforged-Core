buildscript {
    repositories {
        maven { url = "https://repo.spongepowered.org/maven" }
        //maven { url = 'https://sizableshrimp.me/maven' }
        maven { url = "https://plugins.gradle.org/m2/" }
        maven { url = "https://maven.parchmentmc.org" }
        maven { url = 'https://maven.terraformersmc.com' }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'GeckoLib'
                    url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
                }
            }
            filter { includeGroupAndSubgroups('com.geckolib') }
        }
        mavenCentral()
    }
    dependencies {
        classpath "org.spongepowered:mixingradle:0.7+"
        classpath "org.apache.httpcomponents:httpmime:4.5.14"
        classpath "org.parchmentmc:librarian:1.+"
    }
}

plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom" version "1.14-SNAPSHOT" apply false
    id 'com.gradleup.shadow' version '9.3.0' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"

    //loom {
     //   silentMojangMappingsLicense()
    //}

    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
        //mappings loom.officialMojangMappings()
    }

    //afterEvaluate {
    //    tasks.matching { it.name in ["sourcesJar", "remapSourcesJar"] }.configureEach {
    //        enabled = false
    //    }
    //}

    //afterEvaluate {
    //   tasks.matching { it.name in ["sourcesJar", "remapSourcesJar"] }.configureEach {
    //        enabled = false
    //    }
    //}
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"


    base {
        archivesName = "$rootProject.archives_base_name-$project.name-$rootProject.minecraft_version"
    }

    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven {
            url = "https://api.modrinth.com/maven"
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 25
    }

    java {
        withSourcesJar()
    }

    jar {
        zip64(true)
        from "LICENSE"
        from fileTree("$projectDir/common/src/main/generated/resources") { exclude "**/.cache/**" }
    }

    sourcesJar {
        setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)
        zip64(true)
    }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    'src/main/generated'
            ]
        }
    }
}

def readMarkdownFile(String filePath) {
    def file = file(filePath)
    if (file.exists()) {
        return file.text
    } else {
        throw new FileNotFoundException("File not found: ${filePath}")
    }
}

