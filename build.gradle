def calculateJarSha512(filepath) {
    //def jarFile = file("fabric/build/libs/${rootProject.archives_base_name}-fabric-${rootProject.minecraft_version}-${{rootProject.mod_version}}.jar")
    //def jarFile = file("fabric/build/libs/ConquestRefabricated-1.1.7.jar")
    if (!filepath || filepath.trim().isEmpty()) {
        //println "Error: Filepath is null or empty"
        return ""
    }
    def jarFile = file(filepath)

    if (jarFile.exists()) {
        def sha512Hash = Files.asByteSource(jarFile)
                .hash(Hashing.sha512())
                .toString()
        println "SHA-512 Hash of ${jarFile.name}: ${sha512Hash}"
        return sha512Hash
    } else {
        println "JAR file not found: ${jarFile.path}"
        return ""
    }
}

def calculateJarSha1(filepath) {
    if (!filepath || filepath.trim().isEmpty()) {
        //println "Error: Filepath is null or empty"
        return ""
    }
    def jarFile = file(filepath)

    if (jarFile.exists()) {
        def sha1Hash = Files.asByteSource(jarFile)
                .hash(Hashing.sha1())
                .toString()
        println "SHA-1 Hash of ${jarFile.name}: ${sha1Hash}"
        return sha1Hash
    } else {
        println "JAR file not found: ${jarFile.path}"
        return ""
    }
}

def calculateJarSize(filepath) {
    if (!filepath || filepath.trim().isEmpty()) {
        //println "Error: Filepath is null or empty"
        return ""
    }
    def jarFile = file(filepath)

    if (jarFile.exists()) {
        def fileSize = jarFile.length()
        println "File Size (${fileSize} bytes)"
        return fileSize
    } else {
        println "JAR file not found: ${jarFile.path}"
        return ""
    }
}

def getModrinthURL(json) {
    if (!json || json.trim().isEmpty()) {
        return ""
    }

    println(json)
    def jsonSlurper = new JsonSlurper()

    def cleanJsonText = json.toString().trim().replaceAll(/\s+/, ' ')

    // Option 2: Use JsonOutput to normalize
    def normalizedJson = JsonOutput.toJson(jsonSlurper.parseText(cleanJsonText))

    // Option 3: Most robust parsing
    try {
        def jsonData = new JsonSlurper().parseText(cleanJsonText)
        def url = jsonData[0].url
        println "Parsed URL: $url"
        return url
    } catch (Exception e) {
        println "Parsing error: ${e.message}"
        println "Original JSON: $cleanJsonText"
    }

    return json[0].url
}

task replaceJsonAndZipModrinth {
    description 'Replace text in a JSON file and create a zip of its folder'

    def uploadedFiles = project.hasProperty('mrFiles') ? project.property('mrFiles') : '[{"url":"Couldnt find Modrinth Files output"}]'
    // Configure the task with these properties

    def jsonFilePath = './modpacks/fabric/modrinth/modrinth.index.json'
    def jarFilePath = "./fabric/build/libs/${rootProject.archives_base_name}-fabric-${rootProject.minecraft_version}-${{rootProject.mod_version}}.jar"
    def replaceSHA512 = calculateJarSha512(jarFilePath)
    def replaceSHA1 = calculateJarSha1(jarFilePath)
    def replaceSize = calculateJarSize(jarFilePath)
    def replaceURL = getModrinthURL(uploadedFiles)

    calculateJarSha512()

    doLast {
        // Validate inputs
        if (!jsonFilePath) {
            throw new GradleException("jsonFilePath must be specified")
        }
        if (replaceSHA512 == null) {
            throw new GradleException("replaceSHA512 must be specified")
        }
        if (replaceSHA1 == null) {
            throw new GradleException("replaceSHA1 must be specified")
        }
        if (replaceSize == null) {
            throw new GradleException("replaceSize must be specified")
        }

        // Resolve the file path
        def jsonFile = file(jsonFilePath)
        if (!jsonFile.exists()) {
            throw new GradleException("JSON file not found: ${jsonFilePath}")
        }

        if (!jsonFile.canRead()) {
            throw new GradleException("Cannot read JSON file. Check file permissions: ${jsonFilePath}")
        }

        // Get the parent directory, handling potential permission issues
        def parentDir = jsonFile.parentFile
        if (!parentDir.exists()) {
            throw new GradleException("Parent directory does not exist: ${parentDir.absolutePath}")
        }

        if (!parentDir.canRead()) {
            throw new GradleException("Cannot read parent directory. Check directory permissions: ${parentDir.absolutePath}")
        }

        // Read the original file content
        def originalContent = jsonFile.text

        // Create a temporary file for modified content
        def tempFile = File.createTempFile("modified-", ".json")
        tempFile.deleteOnExit()

        // Replace the placeholder text
        def modifiedContent = originalContent.replace("@REPLACE-SHA512@", "\"${replaceSHA512.toString()}\"").replace("@REPLACE-SHA1@", "\"${replaceSHA1.toString()}\"").replace("@REPLACE_JAR_SIZE@", replaceSize.toString()).replace("@REPLACE-DOWNLOAD-LINK@", "\"${ replaceURL }\"").replace("@REPLACE-FILE-NAME@", "${rootProject.archives_base_name}-fabric-${rootProject.minecraft_version}-${{rootProject.mod_version}}.jar").replace("@REPLACE-VERSION@", "${{rootProject.mod_version}}")
        tempFile.write(modifiedContent)

        // Ensure build directory exists
        def buildDir = file("${project.buildDir}/json-zips")
        buildDir.mkdirs()

        // Create zip file
        def zipFileName = "${rootProject.archives_base_name}-fabric-${rootProject.minecraft_version}-${{rootProject.mod_version}}.mrpack"
        def zipFile = new File(buildDir, zipFileName)

        // Create ZIP output stream
        // Create ZIP output stream with error handling
        try {
            zipFile.withOutputStream { os ->
                def zipOut = new ZipOutputStream(os)

                // Collect all files from the parent directory
                def filesToZip = FileUtils.listFiles(parentDir, null, true)

                // Add each file to the zip
                filesToZip.each { file ->
                    // Determine the relative path within the zip
                    def relativePath = parentDir.toPath().relativize(file.toPath()).toString()

                    // Create a zip entry
                    def zipEntry = new ZipEntry(relativePath)
                    zipOut.putNextEntry(zipEntry)

                    // Determine which file content to use
                    def contentToWrite = (file.absolutePath == jsonFile.absolutePath) ?
                            tempFile.bytes :
                            file.bytes

                    // Write the file contents
                    zipOut.write(contentToWrite)
                    zipOut.closeEntry()
                }

                // Close the zip output stream
                zipOut.close()
            }

            // Print out the location of the created zip
            println "Created zip file: ${zipFile.absolutePath}"
        } catch (Exception e) {
            throw new GradleException("Failed to create zip file: ${e.message}", e)
        }
    }
}

